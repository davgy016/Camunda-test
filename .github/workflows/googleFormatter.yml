name: ⌛ Google Java Format Check

on: 
  push: 
    branches:
  pull_request:
    branches:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  google-java-format-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Google Java Format
        run: |
          GJF_VERSION=1.28.0
          wget https://github.com/google/google-java-format/releases/download/v${GJF_VERSION}/google-java-format-${GJF_VERSION}-all-deps.jar

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          version: v0.20.4

      - name: Run Google Java Format via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Running google-java-format + reviewdog..."

          GJF_VERSION=1.28.0
          GJF_JAR=google-java-format-${GJF_VERSION}-all-deps.jar

          mkdir -p .reviewdog/tmp
          find . -name "*.java" -not -path "./target/*" -not -path "./.git/*" | while read file; do
            java -jar "$GJF_JAR" "$file" > "$file.formatted"
            diff -u "$file" "$file.formatted" >> .reviewdog/tmp/gjf.patch || true
            rm "$file.formatted"
          done

          if [ -f .reviewdog/tmp/gjf.patch ] && [ -s .reviewdog/tmp/gjf.patch ]; then
            echo "❌ Formatting issues found!"
            echo "------ DIFF START ------"
            cat .reviewdog/tmp/gjf.patch
            echo "------- DIFF END -------"

            cat .reviewdog/tmp/gjf.patch | reviewdog -f=diff \
              -name="google-java-format" \
              -reporter=github-pr-review \
              -level=warning

            exit 1
          else
            echo "✅ No formatting issues found!"
          fi




