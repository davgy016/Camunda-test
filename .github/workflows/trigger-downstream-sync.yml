# .github/workflows/trigger-downstream-sync.yml
# This workflow should be added to the UPSTREAM repository (davgy016/Camunda-test)

name: Trigger Downstream Subtree Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Manual trigger

jobs:
  notify-downstream:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger subtree sync in firstSubtree repository
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DOWNSTREAM_SYNC_TOKEN }}" \
            https://api.github.com/repos/davgy016/firstSubtree/dispatches \
            -d '{
              "event_type": "subtree-update",
              "client_payload": {
                "repository": "${{ github.repository }}",
                "ref": "${{ github.ref }}",
                "sha": "${{ github.sha }}",
                "pusher": "${{ github.actor }}",
                "timestamp": "${{ github.event.head_commit.timestamp }}"
              }
            }'
      
      - name: Log trigger success
        run: |
          echo "✅ Successfully triggered subtree sync in davgy016/firstSubtree"
          echo "📝 Triggered by: ${{ github.actor }}"
          echo "🔄 Commit: ${{ github.sha }}"